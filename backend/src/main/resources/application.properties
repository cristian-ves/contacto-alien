spring.application.name=contacto-alien-backend

# Target toolchain used to assemble, link and run the generated RISC-V program
compiler.target.assembler=riscv64-linux-gnu-as
compiler.target.assembler-flags=-march=rv64imafdc
compiler.target.linker=riscv64-linux-gnu-ld
compiler.target.linker-flags=-static
compiler.target.simulator=qemu-riscv64
# Guest stack size in bytes; keep it equal to TargetConfig.STACK_SIZE_BYTES
compiler.target.simulator-flags=-s,67108864
compiler.target.timeout-seconds=10
compiler.target.max-output-bytes=65536

# Interactive runs (/api/run): simultaneous programs, total duration, time without activity, how long a program
# survives with no console attached, how long a finished session stays readable, unread input allowed.
# The CPU budget of a run is compiler.target.timeout-seconds.
compiler.run.max-sessions=5
compiler.run.wall-seconds=600
compiler.run.idle-seconds=300
compiler.run.detach-grace-seconds=5
compiler.run.finished-retention-seconds=30
compiler.run.max-pending-input-bytes=16384
